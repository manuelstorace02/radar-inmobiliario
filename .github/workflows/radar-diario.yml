name: Radar diario

# Programada 02:00 de Uruguay (05:00 UTC); GitHub suele arrancarla 30-60 min tarde y dura ~3 h
# (InfoCasas completo ~170 min en paralelo con Gallito), así que termina antes de las 06:00. Corre en la nube de GitHub.
# También se puede correr a mano: pestaña Actions > Radar diario > Run workflow.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      max_urls:
        description: "Tope de avisos por fuente (vacío = el de cada fuente)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: radar-diario
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      RADAR_MINUTOS: "50"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Chequear la clave de Supabase
        run: |
          if [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::Falta el secreto SUPABASE_SERVICE_KEY (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Sincronizar configuración
        run: python -m radar seed

      - name: Tipo de cambio
        run: python -m radar tipo-cambio

      - name: Rutina diaria
        run: |
          if [ -n "${{ inputs.max_urls }}" ]; then
            python -m radar diaria --max-urls "${{ inputs.max_urls }}" | tee salida.txt
          else
            python -m radar diaria | tee salida.txt
          fi

      - name: Armar panel web (encriptado con PANEL_CLAVE)
        if: always()
        env:
          PANEL_CLAVE: ${{ secrets.PANEL_CLAVE }}
        run: python -m radar panel --salida _site

      - name: Subir panel
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Resumen en GitHub
        if: always()
        run: |
          cat reportes/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          python -m radar salud >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

  publicar-panel:
    needs: radar
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
